name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request: # the check job only: a PR builds and pushes no image
  merge_group: # the merge queue runs the check job only, like a PR
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/drills-pro/customer-frontend/frontend

jobs:
  # Cheap gate before the image build. `pnpm build` itself runs inside the Dockerfile.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  build:
    needs: check
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Public values, inlined into the bundle by Vite (a PKCE client id is not a secret).
          build-args: |
            VITE_ZITADEL_CLIENT_ID=395594611256459316
            VITE_ZITADEL_ISSUER=https://auth.drills.pro
            VITE_API_URL=https://api.drills.pro
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pins the new digest in drills-pro/k8s (Flux deploys it). Inlined, not a reusable workflow: a caller in another repo
  # cannot reach drills-pro/k8s's bump-image.yml from here (the run fails at parse time). Same steps as core-backend's deploy.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: bump-k8s-frontend-user
    permissions: {}
    env:
      IMAGE: ghcr.io/drills-pro/customer-frontend/frontend
      DIGEST: ${{ needs.build.outputs.digest }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: drills-pro/k8s
          ref: main
          token: ${{ secrets.K8S_REPO_PAT }}
      - name: Set image digest
        id: set
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest: $DIGEST"; exit 1; }
          dir=apps/frontend-user; [ -d "$dir/app" ] && dir="$dir/app"; [ -f apps/frontend-user/image/kustomization.yaml ] && dir=apps/frontend-user/image
          (cd "$dir" && kustomize edit set image "$IMAGE@$DIGEST")
          echo "file=$dir/kustomization.yaml" >> "$GITHUB_OUTPUT"
      - name: Commit and push
        env:
          FILE: ${{ steps.set.outputs.file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git diff --cached --quiet && { echo "$FILE already pins $DIGEST"; exit 0; }
          git commit -m "chore(frontend-user): bump image to $TAG"
          for try in 1 2 3; do  # another app's bump may have landed in between
            git push && exit 0
            git pull --rebase origin main
          done
          exit 1
