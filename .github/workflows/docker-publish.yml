name: Build and Push Docker Image

on:
  push:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/drills-pro/customer-frontend/frontend

jobs:
  # Cheap gate before the image build. `pnpm build` itself runs inside the Dockerfile.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:i18n
      - run: pnpm typecheck

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Public values, inlined into the bundle by Vite (a PKCE client id is not a secret).
          build-args: |
            VITE_ZITADEL_CLIENT_ID=395594611256459316
            VITE_ZITADEL_ISSUER=https://auth.drills.pro
            VITE_API_URL=https://api.drills.pro
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: drills-pro/k8s/.github/workflows/bump-image.yml@main
    with:
      app: frontend-user
      image: ghcr.io/drills-pro/customer-frontend/frontend
      digest: ${{ needs.build.outputs.digest }}
      tag: ${{ github.sha }}
    secrets:
      repo-token: ${{ secrets.K8S_REPO_PAT }}
